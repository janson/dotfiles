# https://www.gnupg.org/documentation/manuals/gnupg/Agent-Options.html

# Native macOS passphrase prompt (from pinentry-mac in the Brewfile)
pinentry-program /opt/homebrew/bin/pinentry-mac

# Cache the passphrase 10 min after last use, 2 hours at most (the defaults)
default-cache-ttl 600
max-cache-ttl 7200
