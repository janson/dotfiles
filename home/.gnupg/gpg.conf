# Trimmed from https://github.com/drduh/YubiKey-Guide/blob/main/config/gpg.conf
# Options: https://www.gnupg.org/documentation/manuals/gnupg/GPG-Options.html

# Strongest algorithms first, for what I send and for new keys
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256

# Don't advertise the GnuPG version or add comments to output
no-comments
no-emit-version
no-greeting

# Show long key IDs, fingerprints, and UID validity
keyid-format 0xlong
with-fingerprint
list-options show-uid-validity
verify-options show-uid-validity

# Reject subkeys that aren't cross-certified
require-cross-certification

# Don't cache passphrases for symmetric (gpg -c) encryption
no-symkey-cache
